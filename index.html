<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camp Challenge — Project Dashboard</title>
<link rel="icon" href="assets/camp-challenge-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Baloo+2:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ===================== LOCK SCREEN ===================== -->
<div id="lock-screen" class="lock-screen" hidden>
  <div class="lock-card">
    <div class="logo-plate"><img class="lock-logo" src="assets/camp-challenge-logo.png" alt="Camp Challenge"></div>
    <h1 class="lock-title">Project Overview</h1>
    <p class="lock-sub" id="lock-sub">Enter the shared password to continue.</p>
    <form id="lock-form">
      <input type="password" id="lock-password" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit" class="btn btn-primary">Unlock</button>
    </form>
    <p class="lock-error" id="lock-error" hidden></p>
  </div>
</div>

<!-- ===================== FIRST-RUN SETUP ===================== -->
<div id="setup-screen" class="lock-screen" hidden>
  <div class="lock-card setup-card">
    <div class="logo-plate"><img class="lock-logo" src="assets/camp-challenge-logo.png" alt="Camp Challenge"></div>
    <h1 class="lock-title">Connect your data repo</h1>
    <p class="lock-sub">This dashboard stores projects &amp; people inside a GitHub repo (as JSON), so it's shared between everyone. Do this once per device.</p>
    <form id="setup-form">
      <label>GitHub owner / org<input type="text" id="setup-owner" placeholder="e.g. zulmarc" required></label>
      <label>Repo name<input type="text" id="setup-repo" placeholder="e.g. dashboard-data" required></label>
      <label>File path<input type="text" id="setup-path" value="dashboard-data.json"></label>
      <label>Branch<input type="text" id="setup-branch" value="main"></label>
      <label>GitHub Personal Access Token <span class="hint">(fine-grained, Contents: Read &amp; Write on that repo. Stays only in this browser.)</span>
        <input type="password" id="setup-token" placeholder="ghp_..." required></label>
      <button type="submit" class="btn btn-primary">Connect</button>
    </form>
    <p class="lock-error" id="setup-error" hidden></p>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="logo-plate"><img class="brand-logo" src="assets/camp-challenge-logo.png" alt="Camp Challenge"></div>
      <div class="brand-text">
        <h1>Project Overview</h1>
        <p class="kicker">Inspiring Aspirations</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="overview">Overview</button>
      <button class="tab" data-tab="projects">Projects</button>
      <div class="tabs-people" id="tabs-people"></div>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="topbar-right">
      <span class="sync-status" id="sync-status">●&nbsp;synced</span>
      <button class="btn btn-ghost btn-small" id="refresh-btn" title="Reload data from GitHub">↻ Refresh</button>
      <button class="btn btn-ghost btn-small" id="lock-btn" title="Lock dashboard">🔒</button>
    </div>
  </header>

  <main class="page" id="page"></main>
</div>

<!-- ===================== MODAL ROOT ===================== -->
<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
